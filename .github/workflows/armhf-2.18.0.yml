name: TensorFlow Raspberry Pi Cross-Compilation (r2.18)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-tensorflow-armhf:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 构建可能需要较长时间

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clone TensorFlow r2.18
      run: |
        git clone --depth 1 --branch r2.18 https://github.com/tensorflow/tensorflow.git
        cd tensorflow
        git submodule update --init --recursive --depth 1
        cd ..

    - name: Run cross-compilation script
      run: |
        cd tensorflow
        sudo tensorflow/tools/ci_build/ci_build.sh PI-PYTHON37 \
          tensorflow/tools/ci_build/pi/build_raspberry_pi.sh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tensorflow-r2.18-armhf-wheel
        path: tensorflow/output-artifacts/*.whl
        retention-days: 5

    - name: Verify build output
      run: |
        cd tensorflow/output-artifacts
        ls -lah *.whl
        echo "Build completed successfully!"
